zxing = "3.5.3"
firebaseMessaging = "24.1.0"
paho = "1.2.5"
junit = "4.13.2"
paparazzi = "1.3.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
