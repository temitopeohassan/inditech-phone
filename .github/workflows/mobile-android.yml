# Android DPC app — builds the APK, runs unit tests and generates app screenshots.
#
# GitHub only runs workflows from the repository-root .github/workflows directory,
# so this file lives here but is scoped to the mobile/ folder via `paths` and
# `working-directory`.
#
# Outputs:
#   * Artifact "dpc-apk"          — debug + release APKs
#   * Artifact "dpc-screenshots"  — PNG screenshots of every screen
#   * mobile/screenshots/         — screenshots committed back to the branch on push
name: Android CI (APK + screenshots)

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:
    inputs:
      tenant_name:
        description: "White-label app name"
        required: false
        default: "Inditech Finance"
      tenant_primary_color:
        description: "White-label primary color (#RRGGBB)"
        required: false
        default: "#0B5FFF"
      api_base_url:
        description: "Platform API base URL baked into the build"
        required: false
        default: "https://api.device-platform.com/"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: Build APK & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.DPC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DPC_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APKs and run unit tests
        env:
          DPC_KEYSTORE_PASSWORD: ${{ secrets.DPC_KEYSTORE_PASSWORD }}
          DPC_KEY_ALIAS: ${{ secrets.DPC_KEY_ALIAS }}
          DPC_KEY_PASSWORD: ${{ secrets.DPC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PtenantName="${{ inputs.tenant_name || 'Inditech Finance' }}" \
            -PtenantPrimaryColor="${{ inputs.tenant_primary_color || '#0B5FFF' }}" \
            -PapiBaseUrl="${{ inputs.api_base_url || 'https://api.device-platform.com/' }}" \
            -PversionCode=${{ github.run_number }} \
            assembleDebug assembleRelease testDebugUnitTest

      - name: Print APK signature checksum (for QR / ZTE provisioning payloads)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | tee signing.txt
          CHECKSUM=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          echo "PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM (debug): $CHECKSUM" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dpc-apk
          path: |
            mobile/app/build/outputs/apk/debug/*.apk
            mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: mobile/app/build/reports/tests/

  screenshots:
    name: Generate app screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens with Paparazzi
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon recordPaparazziDebug

      - name: Collect screenshots into mobile/screenshots
        run: ./scripts/collect-screenshots.sh

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpc-screenshots
          path: mobile/screenshots/
          if-no-files-found: error

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "chore(mobile): update app screenshots [skip ci]"
            git push
          fi
